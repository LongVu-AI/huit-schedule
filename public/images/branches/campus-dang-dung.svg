<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
    <defs>
        <linearGradient id="skyDangDung" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fae8ff" />
            <stop offset="100%" stop-color="#fdf4ff" />
        </linearGradient>
        <linearGradient id="modernGlass" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4338ca" />
            <stop offset="100%" stop-color="#312e81" />
        </linearGradient>
    </defs>
    <!-- Background Sky -->
    <rect width="400" height="240" fill="url(#skyDangDung)" />
    
    <!-- Downtown City Skyline Background -->
    <rect x="30" y="80" width="45" height="120" fill="#e9d5ff" />
    <rect x="85" y="60" width="50" height="140" fill="#ddd6fe" />
    <rect x="270" y="70" width="55" height="130" fill="#ddd6fe" />
    <rect x="330" y="90" width="45" height="110" fill="#e9d5ff" />

    <!-- District 1 Executive Training Building (31 Đặng Dung) -->
    <rect x="135" y="40" width="130" height="160" fill="url(#modernGlass)" rx="6" />

    <!-- High-rise Modern Glass Curtain Façade -->
    <g fill="#a5b4fc" opacity="0.85">
        <rect x="145" y="55" width="24" height="20" rx="2" />
        <rect x="174" y="55" width="24" height="20" rx="2" />
        <rect x="203" y="55" width="24" height="20" rx="2" />
        <rect x="232" y="55" width="24" height="20" rx="2" />

        <rect x="145" y="80" width="24" height="20" rx="2" />
        <rect x="174" y="80" width="24" height="20" rx="2" />
        <rect x="203" y="80" width="24" height="20" rx="2" />
        <rect x="232" y="80" width="24" height="20" rx="2" />

        <rect x="145" y="105" width="24" height="20" rx="2" />
        <rect x="174" y="105" width="24" height="20" rx="2" />
        <rect x="203" y="105" width="24" height="20" rx="2" />
        <rect x="232" y="105" width="24" height="20" rx="2" />

        <rect x="145" y="130" width="24" height="20" rx="2" />
        <rect x="174" y="130" width="24" height="20" rx="2" />
        <rect x="203" y="130" width="24" height="20" rx="2" />
        <rect x="232" y="130" width="24" height="20" rx="2" />
    </g>

    <!-- Glass Revolving Entrance -->
    <rect x="175" y="160" width="50" height="40" fill="#ffffff" rx="4" />
    <rect x="185" y="170" width="30" height="30" fill="#312e81" rx="2" />

    <!-- Signboard -->
    <rect x="145" y="42" width="110" height="10" fill="#f06a19" rx="2" />
    <text x="200" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="7" fill="#ffffff" text-anchor="middle">HUIT - CƠ SỞ QUẬN 1</text>

    <!-- Sidewalk & City Street -->
    <rect x="0" y="200" width="400" height="40" fill="#475569" />
    <rect x="0" y="200" width="400" height="8" fill="#cbd5e1" />

    <!-- Location Badge Overlay -->
    <rect x="15" y="15" width="160" height="26" rx="13" fill="#ffffff" opacity="0.95" />
    <circle cx="28" cy="28" r="6" fill="#8b5cf6" />
    <text x="40" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#1e293b">31 Đặng Dung, Quận 1</text>
</svg>
