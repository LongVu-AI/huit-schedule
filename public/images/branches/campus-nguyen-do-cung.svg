<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
    <defs>
        <linearGradient id="skyNDC" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ccfbf1" />
            <stop offset="100%" stop-color="#f8fafc" />
        </linearGradient>
        <linearGradient id="workshopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
    </defs>
    <!-- Background Sky -->
    <rect width="400" height="240" fill="url(#skyNDC)" />
    
    <!-- High-tech Workshop Building (Nguyễn Đỗ Cung) -->
    <!-- Sawtooth roof structure -->
    <polygon points="50,110 90,80 90,110 130,80 130,110 170,80 170,110 210,80 210,110 250,80 250,110 290,80 290,110 330,80 330,110" fill="#f06a19" />
    
    <!-- Workshop Main Hall -->
    <rect x="50" y="110" width="300" height="90" fill="url(#workshopGrad)" rx="3" />
    
    <!-- Glass industrial roll-up doors and tech windows -->
    <g fill="#38bdf8" opacity="0.85">
        <rect x="70" y="125" width="40" height="40" rx="2" />
        <rect x="120" y="125" width="40" height="40" rx="2" />
        <rect x="240" y="125" width="40" height="40" rx="2" />
        <rect x="290" y="125" width="40" height="40" rx="2" />
    </g>

    <!-- Industrial Roll-up Shutter / Workshop entrance -->
    <rect x="175" y="130" width="50" height="70" fill="#94a3b8" rx="2" />
    <g stroke="#475569" stroke-width="2">
        <line x1="175" y1="140" x2="225" y2="140" />
        <line x1="175" y1="150" x2="225" y2="150" />
        <line x1="175" y1="160" x2="225" y2="160" />
        <line x1="175" y1="170" x2="225" y2="170" />
        <line x1="175" y1="180" x2="225" y2="180" />
        <line x1="175" y1="190" x2="225" y2="190" />
    </g>

    <!-- Gear / Engineering emblem badge -->
    <circle cx="200" cy="55" r="16" fill="#0b3c85" />
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
        <line x1="200" y1="45" x2="200" y2="65" />
        <line x1="190" y1="55" x2="210" y2="55" />
        <line x1="193" y1="48" x2="207" y2="62" />
        <line x1="193" y1="62" x2="207" y2="48" />
    </g>
    <circle cx="200" cy="55" r="7" fill="#f06a19" />

    <!-- Ground Asphalt -->
    <rect x="0" y="200" width="400" height="40" fill="#64748b" />
    <line x1="0" y1="220" x2="400" y2="220" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8,8" />

    <!-- Signboard -->
    <rect x="100" y="112" width="200" height="15" fill="#0b3c85" rx="3" />
    <text x="200" y="123" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8.5" fill="#ffffff" text-anchor="middle">HUIT - TRUNG TÂM THỰC HÀNH XƯỞNG CÔNG NGHỆ</text>

    <!-- Location Badge Overlay -->
    <rect x="15" y="15" width="175" height="26" rx="13" fill="#ffffff" opacity="0.95" />
    <circle cx="28" cy="28" r="6" fill="#10b981" />
    <text x="40" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="10" fill="#1e293b">73/1 Nguyễn Đỗ Cung, Tân Phú</text>
</svg>
