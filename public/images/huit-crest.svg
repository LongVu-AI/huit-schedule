<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <linearGradient id="crestBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b3c85" />
            <stop offset="100%" stop-color="#072554" />
        </linearGradient>
        <linearGradient id="crestOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f06a19" />
            <stop offset="100%" stop-color="#d8570d" />
        </linearGradient>
    </defs>
    
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="48" fill="url(#crestBlue)" />
    <circle cx="50" cy="50" r="43" fill="none" stroke="#f06a19" stroke-width="3" />
    
    <!-- Gear rays -->
    <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95">
        <line x1="50" y1="6" x2="50" y2="13" />
        <line x1="50" y1="87" x2="50" y2="94" />
        <line x1="6" y1="50" x2="13" y2="50" />
        <line x1="87" y1="50" x2="94" y2="50" />
        <line x1="18" y1="18" x2="24" y2="24" />
        <line x1="76" y1="76" x2="82" y2="82" />
        <line x1="18" y1="82" x2="24" y2="76" />
        <line x1="76" y1="24" x2="82" y2="18" />
    </g>

    <!-- Inner circle -->
    <circle cx="50" cy="50" r="33" fill="url(#crestOrange)" />
    
    <!-- Stylized Book & Flame -->
    <path d="M 33 60 Q 50 54 67 60 L 67 44 Q 50 39 33 44 Z" fill="#ffffff" />
    <path d="M 50 41 L 50 58" stroke="#0b3c85" stroke-width="2.2" />
    
    <!-- Graduation Cap -->
    <polygon points="50,22 63,29 50,36 37,29" fill="#ffffff" />
    <polygon points="44,33 44,39 50,42 56,39 56,33" fill="#ffffff" opacity="0.95" />

    <!-- Text badge -->
    <rect x="30" y="69" width="40" height="15" rx="4" fill="#ffffff" />
    <text x="50" y="80.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11" fill="#0b3c85" text-anchor="middle" letter-spacing="1.5">HUIT</text>
</svg>
